[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlflow-triton"
version = "0.4.1"
description = "MLflow logging wrappers and portable Triton model repositories"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "mlflow>=3.14,<4",
    "protobuf>=3.20.3",
]

[project.urls]
Homepage = "https://github.com/ai-lab-tech/mlflow-plugin"
Documentation = "https://github.com/ai-lab-tech/mlflow-plugin/blob/main/packages/mlflow-triton/README.md"
Repository = "https://github.com/ai-lab-tech/mlflow-plugin"
Issues = "https://github.com/ai-lab-tech/mlflow-plugin/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mlflow_triton*"]

[tool.setuptools.package-data]
mlflow_triton = ["py.typed"]
