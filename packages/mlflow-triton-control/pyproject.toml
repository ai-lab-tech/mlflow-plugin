[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlflow-triton-control"
version = "0.4.0"
description = "Optional MLflow deployment integration for Triton Control"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["mlflow-triton==0.4.0", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mlflow_triton_control*"]

[project.entry-points."mlflow.deployments"]
triton-control = "mlflow_triton_control.deployment_client"
