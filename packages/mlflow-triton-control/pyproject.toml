[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlflow-triton-control"
version = "0.4.2"
description = "Optional MLflow deployment integration for Triton Control"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["mlflow-triton==0.4.2", "httpx>=0.27,<1"]

[project.urls]
Homepage = "https://github.com/ai-lab-tech/mlflow-plugin"
Documentation = "https://github.com/ai-lab-tech/mlflow-plugin/blob/main/packages/mlflow-triton-control/README.md"
Repository = "https://github.com/ai-lab-tech/mlflow-plugin"
Issues = "https://github.com/ai-lab-tech/mlflow-plugin/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mlflow_triton_control*"]

[project.entry-points."mlflow.deployments"]
triton-control = "mlflow_triton_control.deployment_client"
